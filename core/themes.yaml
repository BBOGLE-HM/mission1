# 테마별 추천 규칙 (PRD F2)
# keywords: 포함 시 가점(가중치), exclude: 포함 시 결과에서 제외, penalty: 포함 시 감점
# kids: true 이면 아이 연령 필터와 KOPIS 아동공연 검색을 사용
# exclude_late_night: true 이면 심야 운영(21시 이후 시작 또는 23시 이후 종료) 항목 제외
# ※ 한글은 부분 문자열로 매칭되므로 짧은 단어(예: '클럽' → '북클럽')는 피하고 구체적으로 적는다.
#   연령 제한은 관람등급으로 따로 거르므로 '19세' 같은 숫자는 넣지 않는다.

kids:
  label: "👶 아이와 함께"
  kids: true
  exclude_late_night: true
  keywords: {키즈: 3, 어린이: 3, 아동: 3, 유아: 3, 인형극: 3, 가족: 2, 체험: 2, 동물: 2, 과학: 2, 놀이: 2, 박물관: 1, 동화: 2}
  exclude: [청소년관람불가, 성인전용, 성인 전용, 19금, 나이트클럽, 클럽 파티, 주류 판매, 술 파티]
  penalty: {}

parents:
  label: "👴 부모님과 함께"
  keywords: {국악: 3, 전통: 3, 클래식: 3, 트로트: 3, 가곡: 2, 가요: 2, 수목원: 2, 정원: 2, 국화: 2, 단풍: 2, 전시: 1, 미술: 1, 사찰: 2}
  exclude: []
  penalty: {마라톤: 3, 익스트림: 3, 나이트클럽: 3, 클럽 파티: 3, 힙합: 2, 트레킹: 2, 등반: 2, 하이킹: 2, 둘레길: 1}

couple:
  label: "💑 연인과 함께"
  keywords: {뮤지컬: 3, 야경: 3, 불꽃: 3, 빛: 2, 전시: 2, 공방: 2, 클래스: 2, 재즈: 2, 와인: 2, 로맨틱: 2, 연극: 1}
  exclude: []
  penalty: {어린이: 2, 아동: 2}

friends:
  label: "👫 친구와 함께"
  keywords: {페스티벌: 3, 축제: 2, 콘서트: 3, 대중음악: 3, 방탈출: 3, 스포츠: 2, 록: 2, 힙합: 2, 맥주: 2, 체험: 1}
  exclude: []
  penalty: {아동: 2, 유아: 2}

solo:
  label: "🙋 혼자서"
  keywords: {전시: 3, 미술: 2, 사진: 2, 영화: 2, 독립: 2, 클래스: 2, 강연: 2, 연극: 2, 도서: 2, 클래식: 1}
  exclude: []
  penalty: {가족: 1}
