[theme]
font = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
headingFont = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
baseRadius = "0.75rem"

[theme.light]
primaryColor = "#F2643F"
backgroundColor = "#FFFBF6"
secondaryBackgroundColor = "#FFF0E4"
textColor = "#2B2533"
linkColor = "#D9502D"

[theme.light.sidebar]
backgroundColor = "#FFF3E9"

[theme.dark]
primaryColor = "#FF8A68"
backgroundColor = "#17141C"
secondaryBackgroundColor = "#25202C"
textColor = "#F3EEF6"
linkColor = "#FF9C80"

[theme.dark.sidebar]
backgroundColor = "#1E1A24"
